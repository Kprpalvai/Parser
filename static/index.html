<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Job Application Tracker</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#182033;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.top h1{margin:0}.muted{color:#6d778c}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#5b5ce2;color:#fff}.btn.alt{background:#fff;color:#182033;border:1px solid #dfe4ee}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #e3e7ef;border-radius:14px;padding:16px;box-shadow:0 8px 25px rgba(30,40,70,.06)}.k{font-size:12px;text-transform:uppercase;color:#6d778c;font-weight:700}.v{font-size:28px;font-weight:800;margin-top:6px}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar input,.toolbar select,input,textarea,select{border:1px solid #dde2ec;border-radius:9px;padding:10px;width:100%;font:inherit}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5;font-size:13px}th{font-size:11px;text-transform:uppercase;color:#6d778c}.row{cursor:pointer}.row:hover{background:#fafbff}.pill{padding:5px 8px;border-radius:999px;background:#eef1f6;font-size:11px;font-weight:700}.score{font-weight:800}.hi{color:#178a5c}.mid{color:#c47d13}.lo{color:#c64343}.section{margin-top:18px}.section h3{font-size:12px;text-transform:uppercase;color:#6d778c}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{padding:5px 7px;border-radius:7px;background:#eef1f6;font-size:11px}.miss{background:#fff0eb;color:#a84c31}.links a{display:block;margin:7px 0;color:#4c4ed3}.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.barrow{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:12px;margin:9px 0}.bar{height:8px;background:#edf0f5;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#5b5ce2}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{background:#fff;border-radius:14px;padding:20px;max-width:900px;width:100%;max-height:92vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}textarea{min-height:120px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid,.charts{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Job Application Tracker</h1><div class="muted">Applications, ATS fit, resume changes, referrals and reporting in one dashboard.</div></div><button class="btn" onclick="openForm()">+ Add application</button></div>
<div id="kpis" class="cards"></div>
<div class="grid"><div class="card"><div class="toolbar"><input id="q" placeholder="Search company or role"><select id="sf"><option value="">All statuses</option></select></div><div style="overflow:auto"><table><thead><tr><th>Company / Role</th><th>Status</th><th>ATS</th><th>Applied</th><th>Portal</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2 style="margin-top:0">Role intelligence</h2><div id="detail" class="muted">Select an application to see ATS gaps, resume changes, hiring-manager and referral paths.</div></div></div>
<div class="charts"><div class="card"><h2>Status report</h2><div id="statusChart"></div></div><div class="card"><h2>Source report</h2><div id="sourceChart"></div></div></div>
</div>
<div id="modal" class="modal"><div class="box"><h2 id="ftitle">Add application</h2><form id="form" class="form"><input type="hidden" id="id"><input id="company" placeholder="Company" required><input id="title" placeholder="Job title" required><input id="location" placeholder="Location"><select id="status"></select><input id="applied_date" type="date"><input id="source" placeholder="Source"><input id="apply_url" placeholder="Apply / portal URL"><input id="salary" placeholder="Salary"><textarea id="job_description" class="full" placeholder="Paste job description"></textarea><textarea id="resume_text" class="full" placeholder="Paste resume used for this role"></textarea><input id="hiring_manager_name" placeholder="Hiring manager name"><input id="hiring_manager_url" placeholder="Hiring manager profile URL"><input id="referral_name" placeholder="Referral name"><input id="referral_url" placeholder="Referral profile URL"><textarea id="notes" class="full" placeholder="Notes"></textarea><div class="actions full"><button type="button" class="btn alt" onclick="closeForm()">Cancel</button><button class="btn" type="submit">Save & score</button></div></form></div></div>
<script>
const S=["Saved","Applied","Recruiter Screen","Interview","Final Round","Offer","Rejected","Withdrawn"],$=x=>document.getElementById(x);let apps=[],report={};
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});if(!r.ok)throw Error((await r.json()).detail||"Request failed");return r.json()}
const esc=s=>String(s??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));const cls=n=>n>=80?"hi":n>=65?"mid":"lo";
async function load(){[apps,report]=await Promise.all([api('/api/applications'),api('/api/report')]);render()}
function render(){let ks=[["Tracked",report.total],["Active",report.active],["Avg ATS",report.avg_ats+"%"],["Interview rate",report.interview_rate+"%"],["Offers",report.offers]];$('kpis').innerHTML=ks.map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('');renderRows();bars('statusChart',report.status_counts);bars('sourceChart',report.source_counts)}
function filtered(){let q=$('q').value.toLowerCase(),s=$('sf').value;return apps.filter(a=>(!q||(a.company+' '+a.title+' '+a.location).toLowerCase().includes(q))&&(!s||a.status===s))}
function renderRows(){$('rows').innerHTML=filtered().map(a=>`<tr class="row" onclick="detail(${a.id})"><td><b>${esc(a.company)}</b><div class="muted">${esc(a.title)} · ${esc(a.location)}</div></td><td><span class="pill">${esc(a.status)}</span></td><td><span class="score ${cls(a.ats_score)}">${a.ats_score}%</span></td><td>${esc(a.applied_date||'—')}</td><td>${a.apply_url?`<a href="${esc(a.apply_url)}" target="_blank" onclick="event.stopPropagation()">Apply ↗</a>`:'—'}</td></tr>`).join('')}
function detail(id){let a=apps.find(x=>x.id===id),p=a.people_strategy;$('detail').innerHTML=`<h2>${esc(a.company)}</h2><div class="muted">${esc(a.title)} · ${esc(a.location)}</div><p><b>ATS match: <span class="score ${cls(a.ats_score)}">${a.ats_score}%</span></b></p><div class="section"><h3>Matched keywords</h3><div class="tags">${a.matched_keywords.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="section"><h3>Missing / underrepresented</h3><div class="tags">${a.missing_keywords.map(x=>`<span class="tag miss">${esc(x)}</span>`).join('')}</div></div><div class="section"><h3>Suggested resume changes</h3><ul>${a.suggestions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><h3>Hiring manager / referral</h3><p><b>Hiring manager:</b> ${esc(a.hiring_manager_name||'Not identified yet')}</p><p><b>Referral:</b> ${esc(a.referral_name||'Not identified yet')}</p><div class="links">${p.searches.map(x=>`<a target="_blank" href="${x.url}">${esc(x.label)} ↗</a>`).join('')}</div></div><button class="btn alt" onclick="edit(${a.id})">Edit</button>`}
function bars(id,d={}){let e=Object.entries(d),m=Math.max(1,...e.map(x=>x[1]));$(id).innerHTML=e.map(([k,v])=>`<div class="barrow"><span>${esc(k)}</span><div class="bar"><i style="width:${v/m*100}%"></i></div><b>${v}</b></div>`).join('')}
function openForm(){$('form').reset();$('id').value='';$('status').value='Saved';$('ftitle').textContent='Add application';$('modal').classList.add('open')}function closeForm(){$('modal').classList.remove('open')}
function edit(id){let a=apps.find(x=>x.id===id);openForm();$('id').value=id;$('ftitle').textContent='Edit application';['company','title','location','status','applied_date','source','apply_url','salary','job_description','resume_text','hiring_manager_name','hiring_manager_url','referral_name','referral_url','notes'].forEach(k=>$(k).value=a[k]||'')}
$('form').onsubmit=async e=>{e.preventDefault();let o={};['company','title','location','status','applied_date','source','apply_url','salary','job_description','resume_text','hiring_manager_name','hiring_manager_url','referral_name','referral_url','notes'].forEach(k=>o[k]=$(k).value.trim());let id=$('id').value;await api(id?'/api/applications/'+id:'/api/applications',{method:id?'PUT':'POST',body:JSON.stringify(o)});closeForm();load()};
S.forEach(s=>{$('status').insertAdjacentHTML('beforeend',`<option>${s}</option>`);$('sf').insertAdjacentHTML('beforeend',`<option>${s}</option>`)});$('q').oninput=renderRows;$('sf').onchange=renderRows;load();
</script></body></html>
